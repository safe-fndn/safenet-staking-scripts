name: index

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: index-snapshot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Safenet Database Cache
        uses: actions/cache@v4
        with:
          path: safenet.db
          key: safenet-aegis-db-${{ github.run_id }}
          restore-keys: safenet-aegis-db-

      - name: Index
        env:
          DATABASE_FILE: safenet.db
          STAKING_RPC_URL: ${{ secrets.STAKING_RPC_URL }}
          CONSENSUS_RPC_URL: ${{ secrets.CONSENSUS_RPC_URL }}
        run: |
          cp .env.sample .env
          npm run cmd:index

      - name: Archive snapshot
        uses: actions/upload-artifact@v7
        with:
          name: index-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: safenet.db
          if-no-files-found: error
