name: docker

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/*'
    tags:
      - '*'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: release
        if: startsWith(github.ref, 'refs/heads/release/')
        run: echo "name=${GITHUB_REF#refs/heads/release/}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/safe-fndn/safenet-staking-scripts
          tags: |
            type=ref,event=branch,enable=${{ !startsWith(github.ref, 'refs/heads/release/') }}
            type=ref,event=tag
            type=ref,event=pr
            type=raw,value=${{ steps.release.outputs.name }},enable=${{ startsWith(github.ref, 'refs/heads/release/') }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
