name: distribution

on:
  schedule:
    - cron: "23 4 * * 2"
  workflow_dispatch:
    inputs:
      verifyFromGenesis:
        description: Verify without restoring the event database cache
        type: boolean
        default: false

concurrency:
  group: distribution
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DATABASE_FILE: safenet.db
  STAKING_RPC_URL: ${{ secrets.STAKING_RPC_URL }}
  CONSENSUS_RPC_URL: ${{ secrets.CONSENSUS_RPC_URL }}
  IPFS_GATEWAY_URL: ${{ vars.IPFS_GATEWAY_URL }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shouldRun: ${{ steps.release.outputs.shouldRun }}
      previousCid: ${{ steps.plan.outputs.previousCid }}
      periodStart: ${{ steps.plan.outputs.periodStart }}
      periodEnd: ${{ steps.plan.outputs.periodEnd }}
      settled: ${{ steps.plan.outputs.settled }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - name: Plan next period
        id: plan
        run: |
          : "${STAKING_RPC_URL:?Set the STAKING_RPC_URL repository secret}"
          : "${CONSENSUS_RPC_URL:?Set the CONSENSUS_RPC_URL repository secret}"
          : "${IPFS_GATEWAY_URL:?Set IPFS_GATEWAY_URL to a reachable trustless gateway}"
          cp .env.sample .env
          npm run --silent cmd:plan > "$RUNNER_TEMP/plan.json"
          previous_cid=$(jq -er '.previousCid' "$RUNNER_TEMP/plan.json")
          period_start=$(jq -er '.period.fromTimestamp' "$RUNNER_TEMP/plan.json")
          period_end=$(jq -er '.period.toTimestamp' "$RUNNER_TEMP/plan.json")
          settled=$(jq -r '.settled' "$RUNNER_TEMP/plan.json")
          [[ "$previous_cid" =~ ^b[a-z2-7]+$ && "$period_start" =~ ^[0-9]+$ &&
             "$period_end" =~ ^[0-9]+$ && "$settled" =~ ^(true|false)$ ]]
          printf 'previousCid=%s\nperiodStart=%s\nperiodEnd=%s\nsettled=%s\n' \
            "$previous_cid" "$period_start" "$period_end" "$settled" >> "$GITHUB_OUTPUT"

      - name: Skip unsettled or already released periods
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SETTLED: ${{ steps.plan.outputs.settled }}
          PERIOD_END: ${{ steps.plan.outputs.periodEnd }}
        run: |
          echo "shouldRun=false" >> "$GITHUB_OUTPUT"
          if [[ "$SETTLED" != true ]]; then
            echo "Period $PERIOD_END has not settled yet."
            exit 0
          fi
          status=$(curl --silent --show-error --output "$RUNNER_TEMP/release.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/rewards-$PERIOD_END")
          case "$status" in
            200) echo "Release rewards-$PERIOD_END already exists." ;;
            404) echo "shouldRun=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "Release lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

  export:
    needs: plan
    if: needs.plan.outputs.shouldRun == 'true'
    runs-on: ubuntu-latest
    outputs:
      artifactName: distribution-assets-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      # Restore only: distribution jobs never save or share their modified DBs.
      # A miss starts indexing from the configured deployment blocks.
      - uses: actions/cache/restore@v4
        with:
          path: safenet.db
          key: safenet-aegis-db-export-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: safenet-aegis-db-

      - name: Index and export
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PERIOD_END: ${{ needs.plan.outputs.periodEnd }}
        run: |
          cp .env.sample .env
          npm run cmd:index
          # The gateway supplies the ENS-pinned previous CAR, including the first run.
          npm run --silent cmd:export -- --out release-assets | tee export-summary.txt
          # ENS may advance between plan and export. Never hand off another period.
          test -f "release-assets/rewards-$PERIOD_END.car"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: distribution-assets-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-assets/
          if-no-files-found: error

      - name: Save export summary for release notes
        uses: actions/upload-artifact@v7
        with:
          name: distribution-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: export-summary.txt
          if-no-files-found: error

  verify:
    needs: [plan, export]
    runs-on: ubuntu-latest
    outputs:
      cid: ${{ steps.verify.outputs.cid }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci

      - uses: actions/cache/restore@v4
        if: ${{ !inputs.verifyFromGenesis }}
        with:
          path: safenet.db
          key: safenet-aegis-db-verify-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: safenet-aegis-db-

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.export.outputs.artifactName }}
          path: release-assets

      - name: Independently verify the exported CID
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cp .env.sample .env
          cid=$(cat release-assets/cid.txt)
          [[ "$cid" =~ ^b[a-z2-7]+$ ]]
          npm run cmd:verify -- --cid "$cid"
          echo "cid=$cid" >> "$GITHUB_OUTPUT"

  release:
    needs: [plan, export, verify]
    if: needs.plan.outputs.shouldRun == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.export.outputs.artifactName }}
          path: release-assets

      - uses: actions/download-artifact@v8
        with:
          name: distribution-summary-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish verified distribution
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PERIOD_END: ${{ needs.plan.outputs.periodEnd }}
          VERIFIED_CID: ${{ needs.verify.outputs.cid }}
        run: |
          test -n "$VERIFIED_CID"
          test "$VERIFIED_CID" = "$(cat cid.txt)"
          test -f "rewards-$PERIOD_END.car"
          {
            printf 'Workflow commit (informational only): %s\n\n' "$GITHUB_SHA"
            echo 'Export summary (amounts in SAFE; no New KYC Approval list means 0 new approvals):'
            echo '```text'
            cat ../export-summary.txt
            echo '```'
            cat <<'EOF'

          Review proposal.json and independently run cmd:verify before answering.
          In Safe Transaction Builder, using any Safe:
          1. Load and execute propose.json; wait for the proposal transaction to be confirmed.
          2. Check the module's current question mapping. Only for the original nonce-0 question
             with no earlier answer, load and execute answer.json to post the initial Yes
             with the minimum bond. Re-asked questions and earlier answers need manual handling.
          3. Wait for Reality.eth to finalize Yes and for the module cooldown to elapse, then
             load and execute execute.json before answer expiration. Check the live oracle
             and module timing; challenges can restart the timeout.

          This workflow publishes files only; it sends no onchain transactions.
          These release assets are non-canonical mirrors. The canonical references are the
          onchain Cumulative Merkle Drop root and rewards.safenet-gov.eth ENS contenthash.
          EOF
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create "rewards-$PERIOD_END" \
            --target "$GITHUB_SHA" --title "Rewards $PERIOD_END" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "rewards-$PERIOD_END.car" cid.txt merkle-root.txt proposal.json \
            propose.json answer.json execute.json SHA256SUMS
